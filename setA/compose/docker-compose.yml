services:
  web:
    image: nimratariq5436/mid-app:54909
    container_name: web
    ports:
      - "8009:5000"
    environment:
      - ROLLNO=54909
      - REDIS_HOST=cache
    networks:
      - net-54909
    depends_on:
      - cache

  cache:
    image: redis:alpine
    container_name: cache
    command: redis-server --appendonly yes --dir /data
    volumes:
      - data-54909:/data
    networks:
      - net-54909

networks:
  net-54909:
    driver: bridge

volumes:
  data-54909: